<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistema de Triagem</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Logo topo direito -->
  <header>
    <img src="icone.png" alt="Logo" class="logo">
  </header>

  <!-- Conteúdo -->
  <main class="container">
    <h1>Sistema de Triagem</h1>
    <p>Selecione o tipo de Atendimento</p>

    <div class="buttons">

      <a href="./pages/Atendimento_Geral.html?tipo=G" onclick="sessionStorage.setItem('inicioTriagem', Date.now())">
          <button class="btn padrao">Atendimento Padrão</button>
      </a>

      <a href="./pages/Atendimento_Geral.html?tipo=P" onclick="sessionStorage.setItem('inicioTriagem', Date.now())">
          <button class="btn preferencial">Atendimento Preferencial</button>
      </a>

      <a href="./pages/Atendimento_Libras.html?tipo=L" onclick="sessionStorage.setItem('inicioTriagem', Date.now())">
          <button class="btn libras">Atendimento com suporte em Libras</button>
      </a>

      <a href="./pages/Tela_Monitor.html">
          <button class="btn monitor">Monitor</button>
      </a>

      <a href="./pages/Recepcao.html">
          <button class="btn padrao">Recepção</button>
      </a>
    </div>
  </main>

</body>
</html>
