<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento em Libras</title>
    <link rel="stylesheet" href="../styles/Atendimento_Libras.css" />
    <script src="../script/Atendimento_Libras.js" defer></script>
</head>
<body>

    <div class="container">

        <div class="painel-superior">

            <div class="coluna esquerda">
                <h1 class="titulo">Atendimento</h1>

                <form id="formulario" class="formulario">

                    <div class="campo">
                        <label>Nome</label>
                        <input type="text" id="nome" placeholder="Digite seu nome e sobrenome">
                    </div>

                    <div class="campo">
                        <label>Data de nascimento</label>
                        <input type="date" id="data">
                    </div>

                    <div class="campo campo-sintomas">
                        <label>Sintomas</label>
                        <textarea id="sintomas" placeholder="Clique para escolher os sintomas..." readonly></textarea>
                    </div>

                    <div class="botoes">
                        <button type="button" class="btn voltar" onclick="history.back()">Voltar</button>
                        <button type="submit" class="btn finalizar">Finalizar</button>
                    </div>

                </form>
            </div>

        </div>

        <hr class="divisor">

        <div class="painel-inferior">
            <h2 class="titulo-teclado">Teclado em Libras</h2>

            <div class="teclado-libras">

                <div class="linha-teclado">
                    <button class="tecla"><span class="letra">1</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">2</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">3</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">4</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">5</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">6</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">7</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">8</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">9</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">0</span><span class="sinal"></span></button>
                </div>

                <div class="linha-teclado">
                    <button class="tecla"><span class="letra">A</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">B</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">C</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">D</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">E</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">F</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">G</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">H</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">I</span><span class="sinal"></span></button>
                </div>

                <div class="linha-teclado">
                    <button class="tecla"><span class="letra">J</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">K</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">L</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">M</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">N</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">O</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">P</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">Q</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">R</span><span class="sinal"></span></button>
                </div>

                <div class="linha-teclado">
                    <button class="tecla"><span class="letra">S</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">T</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">U</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">V</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">W</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">X</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">Y</span><span class="sinal"></span></button>
                    <button class="tecla"><span class="letra">Z</span><span class="sinal"></span></button>

                    <button class="tecla apagar">
                        <span class="letra">⌫</span>
                        <span class="sinal">Apagar</span>
                    </button>
                </div>

                <div class="linha-teclado">
                    <button class="tecla espaco">
                        <span class="letra">Espaço</span>
                        <span class="sinal">____</span>
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- JANELA DE SINTOMAS -->
    <div id="modalSintomas" class="modal-sintomas">

        <div class="modal-sintomas-conteudo">

            <div class="modal-sintomas-topo">
                <div>
                    <h2>Sintomas em Libras</h2>
                    <p>Assista ao sinal e selecione os sintomas que você está sentindo.</p>
                </div>

                <button type="button" id="fecharSintomas" class="fechar-sintomas">×</button>
            </div>

            <div class="grade-sintomas">

                <div class="card-sintoma" data-sintoma="Dor de barriga">
                    <span class="nome-sintoma">Dor de barriga</span>

                    <div class="video-container">
                        <video class="video-sintoma" muted playsinline preload="metadata">
                            <source src="../sintomas/dor-barriga.mp4" type="video/mp4">
                        </video>

                        <button type="button" class="btn-play-video">▶</button>
                    </div>

                    <button type="button" class="selecionar-sintoma">Selecionar</button>
                </div>

                <div class="card-sintoma" data-sintoma="Dor de cabeça">
                    <span class="nome-sintoma">Dor de cabeça</span>

                    <div class="video-container">
                        <video class="video-sintoma" muted playsinline preload="metadata">
                            <source src="../sintomas/dor-cabeca.mp4" type="video/mp4">
                        </video>

                        <button type="button" class="btn-play-video">▶</button>
                    </div>

                    <button type="button" class="selecionar-sintoma">Selecionar</button>
                </div>

                <div class="card-sintoma" data-sintoma="Dor na garganta">
                    <span class="nome-sintoma">Dor na garganta</span>

                    <div class="video-container">
                        <video class="video-sintoma" muted playsinline preload="metadata">
                            <source src="../sintomas/dor-garganta.mp4" type="video/mp4">
                        </video>

                        <button type="button" class="btn-play-video">▶</button>
                    </div>

                    <button type="button" class="selecionar-sintoma">Selecionar</button>
                </div>

                <div class="card-sintoma" data-sintoma="Dor no corpo">
                    <span class="nome-sintoma">Dor no corpo</span>

                    <div class="video-container">
                        <video class="video-sintoma" muted playsinline preload="metadata">
                            <source src="../sintomas/dor-corpo.mp4" type="video/mp4">
                        </video>

                        <button type="button" class="btn-play-video">▶</button>
                    </div>

                    <button type="button" class="selecionar-sintoma">Selecionar</button>
                </div>

                <div class="card-sintoma" data-sintoma="Enjoo">
                    <span class="nome-sintoma">Enjoo</span>

                    <div class="video-container">
                        <video class="video-sintoma" muted playsinline preload="metadata">
                            <source src="../sintomas/enjoo.mp4" type="video/mp4">
                        </video>

                        <button type="button" class="btn-play-video">▶</button>
                    </div>

                    <button type="button" class="selecionar-sintoma">Selecionar</button>
                </div>

                <div class="card-sintoma" data-sintoma="Falta de ar">
                    <span class="nome-sintoma">Falta de ar</span>

                    <div class="video-container">
                        <video class="video-sintoma" muted playsinline preload="metadata">
                            <source src="../sintomas/falta-ar.mp4" type="video/mp4">
                        </video>

                        <button type="button" class="btn-play-video">▶</button>
                    </div>

                    <button type="button" class="selecionar-sintoma">Selecionar</button>
                </div>

                <div class="card-sintoma" data-sintoma="Febre">
                    <span class="nome-sintoma">Febre</span>

                    <div class="video-container">
                        <video class="video-sintoma" muted playsinline preload="metadata">
                            <source src="../sintomas/febre.mp4" type="video/mp4">
                        </video>

                        <button type="button" class="btn-play-video">▶</button>
                    </div>

                    <button type="button" class="selecionar-sintoma">Selecionar</button>
                </div>

                <div class="card-sintoma" data-sintoma="Tontura">
                    <span class="nome-sintoma">Tontura</span>

                    <div class="video-container">
                        <video class="video-sintoma" muted playsinline preload="metadata">
                            <source src="../sintomas/tontura.mp4" type="video/mp4">
                        </video>

                        <button type="button" class="btn-play-video">▶</button>
                    </div>

                    <button type="button" class="selecionar-sintoma">Selecionar</button>
                </div>

            </div>

            <div class="modal-sintomas-botoes">
                <button type="button" id="limparSintomas" class="btn-limpar-sintomas">Limpar</button>
                <button type="button" id="confirmarSintomas" class="btn-confirmar-sintomas">Confirmar sintomas</button>
            </div>

        </div>

    </div>

</body>
</html>
