<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento em Libras</title>
    <link rel="stylesheet" href="/styles/Atendimento_Libras.css" />
    <script src="/script/Atendimento_Libras.js"></script>
</head>
<body>

    <div class="container">

        <!-- COLUNA ESQUERDA (FORMULÁRIO) -->
        <div class="coluna esquerda">

            <h1 class="titulo">Atendimento</h1>

        <form class="formulario">

            <div class="campo">
                <label>Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo">
            </div>

            <div class="campo">
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00">
            </div>

            <div class="campo">
                <label>Data de nascimento</label>
                <input type="date" id="data">
            </div>

            <div class="campo">
                <label>Sintomas</label>
                <textarea id="sintomas" placeholder="Escolha os sintomas..."></textarea>
            </div>

            <div class="botoes">
                <button type="button" class="btn voltar" onclick="history.back()">Voltar</button>
                <button type="submit" class="btn finalizar">Finalizar</button>
            </div>

        </form>

        </div>

        <!-- COLUNA CENTRAL (WEBCAM PESSOA) -->
        <div class="coluna centro">
            <span>Pessoa</span>
        </div>

        <!-- COLUNA DIREITA (INTÉRPRETE IA) -->
        <div class="coluna direita">
            <span>IA</span>
        </div>

    </div>

</body>
</html>
