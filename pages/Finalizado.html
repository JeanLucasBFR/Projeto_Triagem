<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizado</title>
    <link rel="stylesheet" href="../styles/Finalizado.css">
</head>

<body>

    <div class="container">
        <div class="icone">✔</div>

        <h1 class="titulo">Atendimento finalizado com sucesso</h1>

        <p class="descricao">
            Seus dados foram registrados corretamente.<br>
            Sua classificação de risco é: <strong id="senha-atendimento" style="font-size: 1.5em; color: #2c3e50;">Carregando...</strong>
        </p>
    </div>

    <script>
        // Pega os parâmetros que vieram na URL
        const urlParams = new URLSearchParams(window.location.search);
        const gravidade = urlParams.get('gravidade');

        const elementoSenha = document.getElementById('senha-atendimento');
        
        if (gravidade) {
            elementoSenha.textContent = gravidade.toUpperCase();
        } else {
            elementoSenha.textContent = "Registrado com sucesso!";
        }

        // Redireciona para o início após 6 segundos para dar tempo do usuário ler
        setTimeout(function() {
            window.location.href = "/index.html";
        }, 5000); 
    </script>

</body>
</html>
