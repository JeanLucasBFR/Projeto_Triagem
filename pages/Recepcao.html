<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Painel Recepção</title>

  <script src="/script/Recepcao.js"></script>
</head>
<body>

  <div class="container">

    <h1>Painel da Recepção</h1>

      <h2>Senha Atual</h2>
      <div id="senhaAtual">---</div>

    <!-- TABELA -->

        <tr>
          <th>Nome</th>
          <th>Senha</th>
          <th>Gravidade</th>
          <th>Ação</th>
        </tr>
      </thead>

      <tbody id="lista"></tbody>
    </table>

  </div>

  
</body>
</html>
