<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamada Hospitalar</title>
    <link rel="stylesheet" href="/styles/Tela_Monitor.css" />
    <script src="/script/Monitor.js" defer></script>
</head>
<body>

    <header>Painel de Atendimento</header>

    <div class="area-superior">
        
        <div class="card-chamada info-paciente animar-chamada" id="paciente-destaque">
            
            <div class="bloco-dado">
                <span class="valor-senha" id="destaque-senha">---</span>
            </div>

            <div class="bloco-dado" style="text-align: right; margin-bottom: 30px;">
                <span class="valor-nome" id="destaque-nome">Aguardando...</span>
            </div>

        </div>

        <div class="card-chamada info-local">
            <span class="label">Dirija-se ao</span>
            <span class="valor-local" id="destaque-guiche">---</span>
        </div>

    </div>

    <div class="area-inferior">
        
        <div class="tabela-titulo">
            <span>&#128337;</span> Próximos Pacientes
        </div>

        <div class="grid-header">
            <div>SENHA</div>
            <div>NOME</div>
            <div>GRAVIDADE</div>
        </div>

        <div class="lista-rolagem" id="lista-pacientes">
            </div>
        
    </div>

</body>
</html>
