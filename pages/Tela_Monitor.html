<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Chamada Hospitalar</title>
    <link rel="stylesheet" href="/styles/Tela_Monitor.css" />
</head>
<body>

    <header>Painel de Atendimento</header>

    <div class="area-superior">
        
        <div class="card-chamada info-paciente animar-chamada">
            
            <div class="bloco-dado">
                <span class="valor-senha">A-204</span>
            </div>

            <div class="bloco-dado" style="text-align: right; margin-bottom: 30px;">
                <span class="valor-nome">Maria Silva Souza</span>
            </div>

        </div>

        <div class="card-chamada info-local">
            <span class="label">Dirija-se ao</span>
            <span class="valor-local">Guichê 03</span>
        </div>

    </div>

    <div class="area-inferior">
        
        <div class="tabela-titulo">
            <span>&#128337;</span> Próximos Pacientes
        </div>

        <div class="grid-header">
            <div>SENHA</div>
            <div>NOME</div>
            <div>GRAVIDADE</div>
        </div>

        <div class="lista-rolagem">
            
            <div class="grid-row">
                <div style="font-weight: bold;">A-205</div>
                <div>João Carlos Pereira</div>
                <div><span class="badge bg-urgente">Urgente</span></div>
            </div>

            <div class="grid-row">
                <div style="font-weight: bold;">P-102</div>
                <div>Ana Beatriz Costa</div>
                <div><span class="badge bg-atencao">Preferencial</span></div>
            </div>

            <div class="grid-row">
                <div style="font-weight: bold;">N-330</div>
                <div>Roberto Oliveira</div>
                <div><span class="badge bg-comum">Normal</span></div>
            </div>

            <div class="grid-row">
                <div style="font-weight: bold;">N-331</div>
                <div>Julia Mendes</div>
                <div><span class="badge bg-comum">Normal</span></div>
            </div>

        </div>
        
    </div>

</body>
</html>
